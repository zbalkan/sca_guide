[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhscatune"
version = "0.2.0"
description = "Tailor Wazuh SCA baselines with documented review decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Zafer Balkan", email = "zafer@zaferbalkan.com" },
]
maintainers = [
  { name = "Zafer Balkan", email = "zafer@zaferbalkan.com" },
]
keywords = ["wazuh", "sca", "security-configuration-assessment", "compliance", "hardening"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "Flask==3.1.3",
  "Flask-Session==0.5.0",
  "ruamel.yaml==0.18.6",
  "Werkzeug==3.1.8",
]

[project.urls]
Homepage = "https://github.com/zbalkan/wazuhscatune"
Repository = "https://github.com/zbalkan/wazuhscatune"
Issues = "https://github.com/zbalkan/wazuhscatune/issues"
Documentation = "https://github.com/zbalkan/wazuhscatune#readme"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.9",
  "pip-audit>=2.7",
  "pycodestyle>=2.11",
  "pytest>=8",
  "pytest-cov>=5",
  "twine>=5",
]

[project.scripts]
wazuhscatune = "sca.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sca*"]
exclude = ["sca.tests*"]

[tool.setuptools.package-data]
sca = ["templates/**/*.html", "static/**/*.css", "static/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["sca/tests"]
addopts = "--strict-config --strict-markers"

[tool.mypy]
python_version = "3.11"
packages = ["sca"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "flask_session"
ignore_missing_imports = true
